<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>QuoteBook</title>
    <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Nunito+Sans:wght@400;700&display=swap" rel="stylesheet">

    <style>
        /* Colors (same as the presentation) */
        :root {
            --cream: #F6EEDF;
            --paper: #FBF6EC;
            --line: #DCC9A8;
            --brown: #2E211A;
            --soft-brown: #5A463A;
            --terracotta: #A8482A;
            --dark-red: #7E3219;
        }

        * {
            box-sizing: border-box;
        }

        /* Page: text on the left, picture on the right */
        body {
            margin: 0;
            min-height: 100vh;
            padding: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 60px;
            background: var(--cream);
            color: var(--brown);
            font-family: "Nunito Sans", Arial, sans-serif;
            font-size: 18px;
        }

        main {
            width: 100%;
            max-width: 560px;
        }

        h1 {
            margin: 0;
            font-family: "Libre Baskerville", Georgia, serif;
            font-size: 40px;
        }

        .intro {
            color: var(--soft-brown);
        }

        textarea,
        input {
            width: 100%;
            padding: 14px;
            background: var(--paper);
            color: var(--brown);
            border: 1px solid var(--line);
            border-radius: 8px;
            font: inherit;
        }

        textarea {
            font-family: "Libre Baskerville", Georgia, serif;
            line-height: 1.6;
            resize: vertical;
        }

        textarea:focus,
        input:focus {
            outline: 2px solid var(--terracotta);
        }

        button {
            margin: 14px 0;
            padding: 12px 32px;
            background: var(--terracotta);
            color: var(--cream);
            border: 0;
            border-radius: 8px;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.5;
        }

        /* Result */
        #result {
            min-height: 120px;
            padding-top: 10px;
            border-top: 1px solid var(--line);
        }

        #result p {
            margin: 6px 0;
        }

        .title {
            font-family: "Libre Baskerville", Georgia, serif;
            font-size: 30px;
            font-weight: 700;
            color: var(--dark-red);
        }

        .author {
            font-style: italic;
            color: var(--soft-brown);
        }

        .note {
            color: var(--soft-brown);
        }

        .error {
            color: var(--terracotta);
            font-weight: 700;
        }

        label {
            font-size: 15px;
            color: var(--soft-brown);
        }

        footer {
            margin-top: 40px;
            padding-top: 14px;
            border-top: 1px solid var(--line);
            font-size: 15px;
            color: var(--soft-brown);
        }

        .picture {
            width: 380px;
        }

        /* On small screens the picture is hidden */
        @media (max-width: 900px) {
            .picture {
                display: none;
            }
        }
    </style>
</head>

<body>
    <main>
        <h1>¿De qué título es?</h1>
        <p class="intro">Pega una frase y te digo la obra y el autor.</p>

        <textarea rows="9" placeholder="Pega aquí un fragmento de 40 palabras o más…" id="phrase"></textarea>
        <button id="button">Buscar</button>

        <div id="result"></div>

        <label for="token">Token de Hugging Face</label>
        <input type="password" id="token" placeholder="hf_…">

        <footer>Hecho por Laura T. · 2026</footer>
    </main>

    <!-- Picture: a pile of old books with a cup of coffee and a candle -->
    <svg class="picture" viewBox="0 0 560 720" role="img" aria-label="Pila de libros antiguos con una taza de café y una vela">
        <ellipse cx="280" cy="690" rx="250" ry="18" fill="#DCC9A8" />
        <rect x="40" y="590" width="480" height="90" rx="10" fill="#A8482A" />
        <rect x="40" y="606" width="480" height="10" fill="#D9A441" />
        <rect x="420" y="590" width="26" height="90" fill="#7E3219" />
        <rect x="80" y="505" width="420" height="85" rx="10" fill="#5F6F4A" />
        <rect x="96" y="520" width="388" height="55" rx="4" fill="#FBF6EC" />
        <rect x="80" y="505" width="60" height="85" rx="10" fill="#4A5839" />
        <rect x="30" y="425" width="460" height="80" rx="10" fill="#D9A441" />
        <rect x="110" y="425" width="18" height="80" fill="#B4832A" />
        <rect x="390" y="425" width="18" height="80" fill="#B4832A" />
        <rect x="90" y="350" width="400" height="75" rx="10" fill="#2E211A" />
        <rect x="90" y="378" width="400" height="8" fill="#D9A441" />
        <rect x="60" y="280" width="390" height="70" rx="10" fill="#7E3219" />
        <rect x="76" y="293" width="358" height="44" rx="4" fill="#FBF6EC" />
        <!-- cup of coffee -->
        <path d="M150 190 h150 v60 a30 30 0 0 1 -30 30 h-90 a30 30 0 0 1 -30 -30 z" fill="#FBF6EC" stroke="#DCC9A8" stroke-width="3" />
        <path d="M300 205 h22 a22 22 0 0 1 0 44 h-22" fill="none" stroke="#DCC9A8" stroke-width="12" />
        <rect x="152" y="190" width="146" height="14" fill="#5A463A" />
        <path d="M195 165 q-18 -25 0 -50 q18 -25 0 -50" fill="none" stroke="#B4832A" stroke-width="6" stroke-linecap="round" />
        <path d="M250 165 q-18 -25 0 -50 q18 -25 0 -50" fill="none" stroke="#B4832A" stroke-width="6" stroke-linecap="round" />
        <!-- candle -->
        <rect x="375" y="190" width="40" height="90" rx="4" fill="#EBDDC6" stroke="#DCC9A8" stroke-width="3" />
        <path d="M395 135 q22 30 0 50 q-22 -20 0 -50 z" fill="#D9A441" />
        <circle cx="395" cy="160" r="45" fill="#D9A441" opacity="0.2" />
    </svg>

    <script>
        const URL_API = "https://router.huggingface.co/v1/chat/completions";
        const MODEL = "Qwen/Qwen2.5-72B-Instruct";
        const INSTRUCTIONS =
            'Identifica la obra literaria a la que pertenece el fragmento; puede ser una traducción. ' +
            'Responde únicamente con un JSON así: {"obra":"","autor":"","confianza":0.0}. ' +
            '"confianza" va de 0 a 1. Si no reconoces la obra, deja "obra" vacía y confianza 0.';
        const LOW_CONFIDENCE = 0.6;

        // ---------- Page elements ----------
        const fieldPhrase = document.getElementById("phrase");
        const tokenInput = document.getElementById("token");
        const searchButton = document.getElementById("button");
        const resultBox = document.getElementById("result");

        // ---------- Events ----------
        searchButton.addEventListener("click", search);

        // Enter searches; Shift + Enter writes a new line
        fieldPhrase.addEventListener("keydown", (event) => {
            if (event.key === "Enter" && !event.shiftKey) {
                event.preventDefault();
                search();
            }
        });

        // ---------- Search ----------
        async function search() {
            const phrase = fieldPhrase.value.trim();
            const token = tokenInput.value.trim();

            if (!phrase) return;
            if (!token) {
                showError("Falta el token de Hugging Face.");
                return;
            }

            searchButton.disabled = true;
            showNote("Buscando...");

            try {
                const book = await askModel(phrase, token);
                if (book.obra) {
                    showBook(book);
                } else {
                    showNote("No encontré el libro.");
                }
            } catch (error) {
                showError("No se pudo encontrar: " + error.message);
            } finally {
                searchButton.disabled = false;
            }
        }

        // ---------- API call ----------
        async function askModel(phrase, token) {
            const response = await fetch(URL_API, {
                method: "POST",
                headers: {
                    "Authorization": "Bearer " + token,
                    "Content-Type": "application/json",
                },
                body: JSON.stringify({
                    model: MODEL,
                    max_tokens: 300,
                    temperature: 0,
                    messages: [
                        { role: "system", content: INSTRUCTIONS },
                        { role: "user", content: phrase },
                    ],
                }),
            });

            if (!response.ok) {
                throw new Error("Hugging Face respondió con error " + response.status);
            }

            const data = await response.json();
            const text = data.choices[0].message.content;

            // The model may add text around the JSON, so we keep only the { ... } part
            const jsonMatch = text.match(/\{[\s\S]*\}/);
            if (!jsonMatch) {
                throw new Error("el modelo no devolvió un JSON válido.");
            }
            return JSON.parse(jsonMatch[0]);
        }

        // ---------- Rendering ----------
        function showBook(book) {
            resultBox.replaceChildren(
                paragraph("title", book.obra),
                paragraph("author", book.autor || ""),
            );
            if (book.confianza < LOW_CONFIDENCE) {
                resultBox.appendChild(paragraph("note", "Poca seguridad: conviene verificarlo."));
            }
        }

        function showNote(message) {
            resultBox.replaceChildren(paragraph("note", message));
        }

        function showError(message) {
            resultBox.replaceChildren(paragraph("error", message));
        }

        // Builds a <p> with plain text (textContent, so nothing gets injected as HTML)
        function paragraph(className, text) {
            const p = document.createElement("p");
            p.className = className;
            p.textContent = text;
            return p;
        }
    </script>
</body>

</html>
